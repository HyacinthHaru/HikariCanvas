name: CI

# push/PR 到 main 时跑：前端单测 + 后端单测 + shadowJar artifact。
# 单 job 集成而非拆分：项目前后端互相依赖（gradle syncFontsToWeb 把字体喂 web；
# copyWebToResources 把 vite dist 喂 jar），拆 job 反而要重复 setup-java / setup-node。
# 首跑 ~5min（paperweight dev bundle 首装），后续 ~2min（setup-gradle 缓存生效）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # CLAUDE.md：Node 25 偶卡 vue-tsc，CI 锁 22 LTS 稳定。
          # cache: npm 自动用 web/package-lock.json 做 key 缓存 node_modules 依赖。
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        # 自带 Gradle Dependency Cache + Build Cache + Configuration Cache，无需另配 actions/cache。

      - name: Frontend - install deps
        working-directory: web
        # npm ci 严格按 package-lock.json 装。若 lock 缺平台相关的传递依赖（如
        # @emnapi/*、@rolldown/binding-* 的各平台变体），npm ci 会直接失败 —— 此时
        # 回落到 npm install 保证 CI 可跑，并打 warning 提示 lock 需要重新生成。
        run: npm ci || (echo "::warning::npm ci failed (likely platform-specific dep mismatch); falling back to npm install" && npm install --no-audit --no-fund)

      - name: Frontend - vitest
        working-directory: web
        run: npm run test

      - name: Frontend - vite build (production)
        working-directory: web
        run: npm run build

      - name: Backend - test (:plugin:test)
        run: ./gradlew :plugin:test --no-daemon --stacktrace

      - name: Backend - shadowJar
        # 链路自动跑：compileJava → processResources（含 generatePalette + downloadFonts
        # + copyWebToResources）→ shadowJar relocate 7 个内嵌依赖
        # → ac.haru.hikaricanvas.shaded.*；输出 plugin/build/libs/HikariCanvas-<版本>.jar
        run: ./gradlew :plugin:shadowJar --no-daemon --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: HikariCanvas-${{ github.sha }}
          path: plugin/build/libs/HikariCanvas-*.jar
          retention-days: 30
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            plugin/build/reports/tests/
            plugin/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # 0.9.5 多版本支持：双版本编译守卫。
  # 用 Java 25 对 Paper 26.2 API 编译同一份 main 源码，提前抓「用了 26.x 已移除 API」的回归。
  # 只 compileJava（不跑 :plugin:test —— MockBukkit 锁 1.21；26.x 功能验证靠真服手动测）。
  # 生产 jar 仍由上面的 build job 以 1.21.11 / Java 21 / release 21 产出，一份 jar 通吃两版。
  compat-26:
    name: Compile against Paper 26.x (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile main against Paper 26.2 API
        # paperApi=26.2.build.+ 追最新 26.2 dev bundle（26.2 目前仍在 beta，无 -stable；.+ 通配 beta）；
        # javaVer=25 让 toolchain + options.release 都切 25（26.x paper-api 是 Java 25 字节码，无法 --release 21 编译）。
        # deprecation note（如 World#getName）只 warning 不 fail；真用了已移除 API 才会红。
        run: ./gradlew :plugin:compileJava -PpaperApi=26.2.build.+ -PjavaVer=25 --no-daemon --stacktrace
