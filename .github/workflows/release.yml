name: Release

# Tag 触发：`git tag v1.0.0 && git push origin v1.0.0`
# 自动从 Git tag 提取版本号注入 Gradle（统一 jar 文件名与内嵌 paper-plugin.yml 版本），
# 通过 Paper 26.2 编译守卫、前后端全量测试与产物内胆核验后创建 GitHub Release。
# 含 `-`（如 v1.0.0-rc.1）自动标记为 prerelease。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  compat-26:
    name: Compile against Paper 26.x (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile main and examples against Paper 26.2 API
        run: ./gradlew :plugin:compileJava :examples:demo-train-plugin:compileJava :examples:demo-score-plugin:compileJava -PpaperApi=26.2.build.+ -PjavaVer=25 -PreleaseVersion="${GITHUB_REF_NAME#v}" --no-daemon --stacktrace

  release:
    name: Build & Release
    needs: compat-26
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Extract and validate version from tag
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "${TAG}" ]; then
            echo "::error::Expected tag starting with 'v' (e.g. v1.0.0), got '${TAG}'"
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semantic version '${VERSION}' from tag '${TAG}'"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Releasing version: ${VERSION}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Frontend - install deps + typecheck + test + build
        working-directory: web
        run: |
          npm ci || (echo "::warning::npm ci failed (likely platform-specific dep mismatch); falling back to npm install" && npm install --no-audit --no-fund)
          npm run typecheck
          npm run test
          npm run build

      - name: Backend - test + shadowJar + apiJar + examples
        run: ./gradlew :plugin:test :plugin:shadowJar :plugin:apiJar :examples:demo-train-plugin:jar :examples:demo-score-plugin:jar -PreleaseVersion="${VERSION}" --no-daemon --stacktrace

      - name: Verify jars and embedded metadata
        run: |
          set -eu
          JAR="plugin/build/libs/HikariCanvas-${VERSION}.jar"
          API_JAR="plugin/build/libs/HikariCanvas-${VERSION}-api.jar"
          if [ ! -f "${JAR}" ] || [ ! -f "${API_JAR}" ]; then
            echo "::error::Expected release artifacts not found (${JAR} / ${API_JAR})"
            ls -la plugin/build/libs/ || true
            exit 1
          fi
          EMBEDDED=$(unzip -p "${JAR}" paper-plugin.yml | sed -n "s/^version:[[:space:]]*['\"]*\([^'\"]*\)['\"]*[[:space:]]*$/\1/p" | head -n 1)
          if [ "${EMBEDDED}" != "${VERSION}" ]; then
            echo "::error::paper-plugin.yml version mismatch inside ${JAR}: expected '${VERSION}', got '${EMBEDDED}'"
            unzip -p "${JAR}" paper-plugin.yml | head -n 10 || true
            exit 1
          fi
          if ! unzip -l "${API_JAR}" | grep -q "ac/haru/hikaricanvas/api/HikariCanvasAPI.class"; then
            echo "::error::HikariCanvasAPI.class missing inside ${API_JAR}"
            unzip -l "${API_JAR}" || true
            exit 1
          fi
          if unzip -l "${API_JAR}" | grep -q "paper-plugin.yml"; then
            echo "::error::paper-plugin.yml must not be bundled inside ${API_JAR}"
            exit 1
          fi
          echo "Verified ${JAR} (version='${EMBEDDED}') and ${API_JAR}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            plugin/build/libs/HikariCanvas-${{ env.VERSION }}.jar
            plugin/build/libs/HikariCanvas-${{ env.VERSION }}-api.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
