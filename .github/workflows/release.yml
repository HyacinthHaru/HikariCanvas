name: Release

# Tag 触发：`git tag v1.0.0 && git push origin v1.0.0`
# 自动跑测试 + shadowJar + 创建 GitHub Release + 附 jar。
# 含 `-`（如 v1.0.0-rc.1）自动标 prerelease=true。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 Release 需要

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Frontend - install deps + test + build
        working-directory: web
        # npm ci fallback 与 ci.yml 对齐：macOS dev 生成的 platform-specific transitive
        # deps（@rolldown/binding-* / @emnapi 等）不写入 package-lock.json，CI Linux 上
        # 严格 npm ci 会失败 → fallback 到 npm install 保证 release 跑通。
        run: |
          npm ci || (echo "::warning::npm ci failed (likely platform-specific dep mismatch); falling back to npm install" && npm install --no-audit --no-fund)
          npm run test
          npm run build

      - name: Backend - test + shadowJar
        run: ./gradlew :plugin:test :plugin:shadowJar --no-daemon --stacktrace

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Releasing version: ${VERSION}"

      - name: Rename artifact
        # plugin/build.gradle.kts shadowJar.archiveClassifier="" → 输出
        # HikariCanvas-<gradle-version>.jar；若 tag 版本与 gradle 版本不一致，统一重命名为 tag 版本。
        run: |
          set -eu
          src=$(find plugin/build/libs -name 'HikariCanvas-*.jar' ! -name 'HikariCanvas-*-sources.jar' -print -quit)
          dst="plugin/build/libs/HikariCanvas-${VERSION}.jar"
          if [ "$src" = "$dst" ]; then
            echo "Already named correctly: $src"
          else
            mv "$src" "$dst"
            echo "Renamed: $src → $dst"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: plugin/build/libs/HikariCanvas-${{ env.VERSION }}.jar
          generate_release_notes: true
          draft: false
          # 含 `-`（如 v1.0.0-rc.1）自动标为 prerelease；正式版不标 prerelease。
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
