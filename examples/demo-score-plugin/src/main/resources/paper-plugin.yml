name: DemoScorePlugin
version: '0.9.12-SNAPSHOT'
main: ac.haru.hikaricanvas.demos.score.DemoScorePlugin
api-version: '1.21'
description: HikariCanvas Push API demo — simulated PvP scoreboard with event + command triggers.
authors:
  - HaruHyacinth

dependencies:
  server:
    HikariCanvas:
      load: BEFORE
      required: true
      join-classpath: true

commands:
  demoscore:
    description: 调整 demo 比分（add/reset/set）
    usage: /demoscore <add|reset|set> [team] [value]
    permission: hikari.demo.score

permissions:
  hikari.demo.score:
    description: Operate the DemoScorePlugin scoreboard
    default: op
