spec: 1
id: hello_world
name: Hello World
description: 最简模板示例：湖蓝底 + 白色边框 + 居中文字。
version: 1
author: hikari-canvas-official
tags: [demo, basic]

canvas:
  size: auto
  min_maps: [1, 1]
  max_maps: [8, 4]
  background: "${bg_color}"
  padding: 8

params:
  text:
    type: string
    label: 文字
    default: HELLO WORLD
    max_length: 64

  bg_color:
    type: color
    label: 背景色
    default: "#4A90E2"

  text_color:
    type: color
    label: 文字色
    default: "#FFFFFF"

layout:
  type: free
  elements:
    - type: rect
      x: 0
      y: 0
      w: 100%
      h: 100%
      stroke:
        width: 2
        color: "${text_color}"

    - type: text
      x: 0
      y: 0
      w: 100%
      h: 100%
      content: "${text}"
      font: ark_pixel
      size: 24
      color: "${text_color}"
      align: center
