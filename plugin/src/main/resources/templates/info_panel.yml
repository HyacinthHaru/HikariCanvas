spec: 1
id: info_panel
name: 提示面板
description: 图标 + 标题 + 正文。展示 free 布局 + icon 元素（M7 新增）
version: 1
author: hikari-canvas-official
tags: [sign, info, demo]

canvas:
  size: auto
  min_maps: [3, 1]
  max_maps: [6, 2]
  background: "${bg}"
  padding: 12

params:
  title:
    type: string
    label: 标题
    required: true
    default: 注意事项
    max_length: 16

  body:
    type: text
    label: 正文
    default: 请勿在此处放置火源
    max_length: 80

  icon_kind:
    type: enum
    label: 图标
    default: warning
    options:
      - { label: 警告（三角形 + !）, value: warning }
      - { label: 信息（圆形 + i）,   value: info }
      - { label: 五角星,             value: star }
      - { label: 右箭头,             value: arrow_right }

  icon_color:
    type: color
    label: 图标色
    default: "#E4002B"

  bg:
    type: color
    label: 底色
    default: "#FFF5E5"

  ink:
    type: color
    label: 字色
    default: "#332E1C"

layout:
  type: free
  elements:
    - type: icon
      x: 0
      y: 0
      w: 64
      h: 64
      source: "${icon_kind}"
      tint: "${icon_color}"

    - type: text
      x: 80
      y: 0
      w: 200
      h: 28
      content: "${title}"
      font: source_han_sans
      size: 28
      color: "${ink}"
      align: left

    - type: text
      x: 80
      y: 36
      w: 200
      h: 40
      content: "${body}"
      font: source_han_sans
      size: 16
      color: "${ink}"
      align: left
