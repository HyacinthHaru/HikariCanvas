spec: 1
id: bulletin_board
name: 公告板
description: 标题 + 分隔线 + 正文 + 落款。米黄底，仿羊皮纸风格
version: 1
author: hikari-canvas-official
tags: [sign, notice, bulletin]

canvas:
  size: auto
  min_maps: [3, 1]
  max_maps: [8, 3]
  background: "${bg}"
  padding: 8

params:
  title:
    type: string
    label: 标题
    required: true
    default: 公告
    max_length: 24

  body:
    type: text
    label: 正文
    default: 服务器维护时间 周日 04:00-06:00
    max_length: 128

  signed_by:
    type: string
    label: 落款
    default: ""
    max_length: 32

  show_divider:
    type: bool
    label: 显示分隔线
    default: true

  bg:
    type: color
    label: 底色
    default: "#FFF8DC"

  ink:
    type: color
    label: 字色
    default: "#2C2C2C"

  board_font:
    type: font
    label: 字体
    default: source_han_sans

layout:
  type: stack
  direction: vertical
  gap: 4
  elements:
    - type: text
      content: "${title}"
      font: "${board_font}"
      size: 32
      color: "${ink}"
      align: center

    - type: rect
      h: 2
      fill: "${ink}"
      visible_when: "show_divider == true"

    - type: text
      content: "${body}"
      font: "${board_font}"
      size: 18
      color: "${ink}"
      align: left

    - type: text
      content: "— ${signed_by}"
      font: "${board_font}"
      size: 16
      color: "${ink}"
      align: right
      visible_when: "signed_by != \"\""
