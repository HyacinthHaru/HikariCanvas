# HikariCanvas 配置文件
# ----------------------------------------------------------------
# 修改后用 `/canvas reload config`（管理员）或重启服务器生效。
# 标 [需重启] 的项 hot-reload 不影响 —— 必须重启服务器。
# ----------------------------------------------------------------

# WebSocket / HTTP 编辑器服务
network:
  # 监听地址。生产环境强烈建议保持 127.0.0.1 + nginx/Caddy 反代加 TLS。
  # 直接绑 0.0.0.0 会暴露未加密 token，详见 docs/deployment.md。
  # [需重启]
  host: "127.0.0.1"
  # 监听端口。
  # [需重启]
  port: 8877
  # 玩家点 /canvas confirm 后看到的 URL 模板。{token} 会被实际 token 替换。
  # 内网默认就是 http://127.0.0.1:8877/?token={token}。
  # 公网部署改为 https://yourdomain.com/?token={token}。
  # M16 P6.5 安全收口：仅支持 http:// 和 https:// 协议；javascript: / data: / file: /
  # vbscript: 等一律被拒（防止 admin 误配后玩家点 ActionBar 链接执行任意 JS）。
  # URL 中也不允许含换行（CR/LF）。配置不合法 → 启动期 severe log + 回退到内置默认值。
  editor-url: "http://{host}:{port}/?token={token}"
  # M16 P1.2：WS 连接建立后多少秒内必须完成 auth；超时 → close 4001 auth_timeout。
  # 防御未认证 socket 长挂占连接的 DoS 路径。范围 1-60。
  ws-auth-timeout-seconds: 5
  # M16 P1.3：WS upgrade Origin 白名单。下列三类一律放行，无需配置：
  #   1) Origin 缺失 / null（非浏览器 client，或同源 fetch 不带 Origin）
  #   2) http://127.0.0.1:<port> / http://localhost:<port>
  #   3) 与 network.host:port 完全匹配
  # 公网通过反代部署时把反代 origin 加进来，例如：
  #   allowed-origins:
  #     - "https://canvas.example.com"
  # 默认空列表 = 只信回环 + 同源；其它 Origin 一律 403。
  allowed-origins: []

# 会话生命周期（玩家从 /canvas confirm 到关浏览器的整个过程）
session:
  # token 签发后多久内必须 auth 完成，否则 token 失效。
  token-ttl-minutes: 15
  # WS 连接断开后保留 session 多久（玩家断网重连用）。超时 → cancel。
  ws-grace-minutes: 5
  # ACTIVE 会话无任何输入多久后被清。0 = 永不超时（谨慎，可能 leak 内存）。
  idle-minutes: 30
  # SessionReaper 扫描周期。值越小回收越及时但更费 CPU；30s 是合理默认。
  reaper-scan-seconds: 30
  # 过期 token 异步清理周期。
  token-purge-minutes: 5

# 地图池容量（M2 预览池）
map-pool:
  # 启动时预创建多少张 MapView。每张消耗约 64 KiB 内存 + 一个 mapId。
  # 建议 = 服务器同时编辑会话数 × 平均墙面尺寸（如 4×2=8 张）+ 一些 buffer。
  initial: 64
  # 池上限。达到上限后新会话会拿到 POOL_EXHAUSTED 错误，提示玩家等待。
  # 单服 200 张地图够 25 人同时编辑 4×2 墙面。
  max: 256
  # M16 P2.3：可选 per-world initial 分配（多世界服务器用）。池内按 world 分桶；
  # 给 wall 借出的 map 必须与 wall 所在 world 一致——否则 wall 在 nether 但 map 在
  # overworld 会导致位置概念错乱。下面 key = world name（与 server.properties 一致）。
  # 列出的 world 在启动时确保 ≥ 该数 FREE map；未列出的 world 走 on-demand 扩容
  # （首次 /canvas confirm 时按需 createMap）。所有 per-world 之和不超过 max。
  # 示例：
  #   per-world:
  #     world: 32          # overworld 预热 32 张
  #     world_nether: 8    # nether 预热 8 张
  #     world_the_end: 4   # end 预热 4 张
  per-world: {}

# 投影帧率 / 输入限流
throttle:
  # 服务端把 ProjectState 渲染推送到游戏地图的最大频率（fps）。
  # 玩家停手 → 0 fps；持续输入 → 上限被卡到这个值。5 fps 对 4×2 墙的 MC packet 量是合理上限。
  projection-fps: 5
  # 单 session 输入 op 速率上限（msg/s）。
  input-rate-per-second: 20
  # 突发 op 上限（在任意 2 秒窗口）。
  input-burst: 40

# 0.4.0 方案 B 自适应渲染
# wall 引用秒级变量（schedule.eta_seconds / system.server.tick 等）时，自动把投影间隔
# 切到 high-freq；同时渲染完主动给 chunk-loaded viewer 推 ClientboundMapItemDataPacket
# 弥补 Paper 默认 MapView sync 的 250ms-5s 抖动。
rendering:
  adaptive-fps:
    # 普通 wall 间隔（ms；保持 throttle.projection-fps 等价默认 200ms = 5fps）
    default-min-interval-ms: 200
    # 高频 wall 间隔（ms；50ms = 20fps；CPU / bandwidth 翻倍可接受）
    high-freq-min-interval-ms: 50
    # 是否主动推帧给 chunk-loaded viewer。false → 仅靠 Paper 默认 sync（不稳但带宽更省）。
    push-packets-enabled: true

# 模板系统
templates:
  # 启动时自动 reload；改为 false 适合内置模板需要手工 reload 的工作流。
  auto-reload-on-startup: true
  # 模板缩略图（/api/template/{id}/preview.png）缓存 TTL（秒）。
  # reload templates 时服务端会主动 invalidate；TTL 主要影响浏览器侧。
  preview-cache-seconds: 300
  # M14 创意工坊：每玩家最多可发布模板数。0 = 不限。
  # 持 canvas.template.bypass-limit 权限的玩家跳过此限制。
  max-per-player: 20
  # M16 Phase 1 模板系统 DoS 防御 & 跨用户隔离（当前硬编码，未来可改为本段可配）：
  #   P1.4 YAML 解析：maxAliasesForCollections=50, codePointLimit=5 MiB
  #   P1.5 raw_state 嵌套深度：MAX_DEPTH=32
  #   P1.5 Interpolator：单参数 ≤16 KiB，单次累计输出 ≤1 MiB
  #   P1.6 user-templates：玩家间默认隔绝；apply 他人模板需 canvas.template.use-others（default: op）

# 图片上传（M13）
# 文件存在 plugins/HikariCanvas/uploads/<sha256[:16]>.png；hash 内容寻址，跨 wall
# 引用同 hash 文件零重复存储。详见 docs/security.md §4.5、docs/architecture.md §3.7。
images:
  # 单文件最大字节（KiB）。超出 → 413 UPLOAD_REJECTED。
  max-size-kb: 2048
  # 允许的上传 MIME。magic bytes 与 Content-Type 双层校验。
  allowed-mime: ["image/png", "image/jpeg", "image/webp"]
  # 解码后边长上限；超出自动 bilinear downscale 到此尺寸。
  downscale-max-edge: 1024
  # 单 wall 引用 image 元素的上限（防滥用）。0 = 不限。
  max-per-wall: 16
  # 单玩家 24 小时上传次数。0 = 不限。
  max-uploads-per-day: 50
  # 全服磁盘总配额（MiB）。超出 → 触发 LRU 清理直到腾出空间。0 = 不限。
  max-total-storage-mb: 1024

# .canvas 工程导入限额（0.8）。防恶意大文件 / zip 炸弹。下界均为 1MB。
import:
  # 整个 .canvas 包上限（MB）。超出 → 413 IMPORT_ZIP_TOO_LARGE。
  canvas-max-mb: 10
  # 单个内部文件解压上限（MB）。边读边计数，不信任声明的大小。
  canvas-max-entry-mb: 10
  # 所有内部文件解压总和上限（MB）。防多文件累加的 zip 炸弹。
  canvas-max-total-mb: 50

# 安全（2026-05-25 token 暴力枚举防御）
security:
  # WS auth 帧 token 校验前的每 IP 尝试限流，防御 token 暴破 / 撞库。
  # 合法用户重连 retry 远低于 10 次/分钟，超出几乎必然是攻击。
  # 超限 → close 4429 + audit TOKEN_RATE_LIMIT_EXCEEDED；攻击者每分钟只能试 ≤10 次。
  token-rate-limit:
    # 每 IP 每分钟可尝试的 token 次数。下界 1（即每分钟只准 1 次，过严）。
    per-minute: 10

# 数据库 / 迁移
database:
  # 跑 schema migration 前自动备份 data.db 到 data.db.pre-V<NNN>.bak（含 -wal/-shm）。
  # 0.9.1 起备份做了 WAL 安全（先 wal_checkpoint(TRUNCATE) 再拷），默认打开。
  # 恢复：停服 → 用 .bak 覆盖 data.db（连同 .bak-wal/.bak-shm 覆盖 data.db-wal/-shm，或删除现有 -wal/-shm）→ 启动。
  auto-backup-before-migration: true
  # 备份保留天数：自动删除早于此天数的 data.db.pre-V<NNN>.bak（启动期清一次）。0 = 永久保留。
  backup-retention-days: 30

# 动态数据（0.4.0）
# 详见 docs/dynamic-data.md
dynamic:
  # Plugin Push API 限流（防恶意 / bug 插件刷爆 VariableStore）
  # 见 docs/dynamic-data.md §10.2
  push-rate-limit:
    # 单插件每秒 push 上限（超出 drop tail + WARN log）
    # 100/s 对正常使用绰绰有余；BedWars / 列车 ETA / 比分等业务 1-10/s 即可。
    per-plugin-per-second: 100
    # 全局每秒 push 上限（超出触发保护期）
    # 保护期内所有插件 push 一律 reject——防多插件协同压垮 VariableStore。
    global-per-second: 1000
    # 全局触限后的保护期（ms）—— 期间所有 push reject
    # 10s 给运维 / 日志足够时间排查；保护期结束自动恢复。
    global-circuit-break-ms: 10000

  # 0.4.0 bugfix（Bug 3）：兜底列车 ManualScheduleProvider 配置
  # 见 docs/dynamic-data.md §7.3
  schedule:
    # is_arriving / arrival_status 触发阈值（秒）。eta ≤ 阈值时 is_arriving=true 且
    # arrival_status=arriving-text。默认 60s（原 dynamic-data.md §7.3 写的 5min 已废，
    # 秒粒度更符合实际列车 / 公交业务）。
    arriving-threshold-seconds: 60
    # arrival_status 文案（eta ≤ 阈值时）
    arriving-text: "进站中"
    # arrival_status 文案（eta > 阈值时）
    idle-text: ""

  # 0.4.3：全局用户变量（userglobal/*）配额。详见 docs/dynamic-data.md §17.4
  # 全局变量 = 玩家可创建的跨 wall 共享变量，与 user/* per-wall 隔离不同
  variables:
    # 每 owner 上限（创建超出此数 → QUOTA_EXCEEDED）
    userglobal-max-per-owner: 500
    # 全服总上限（任何 owner 加起来不超过此数）
    userglobal-max-total: 10000

# 0.6：时间轴动画（docs/timeline.md / docs/architecture.md §5.5）
timeline:
  # 新建 timeline 的默认帧率（20 = 一个 Bukkit tick）
  default-fps: 20
  # 服务器级安全阀：单墙 fps 硬上限，钳每条 timeline 的 fps。
  # 这是管理员保护整台服务器的总阀门；插件不做成本估算、不自动校准、不自动降级。
  max-fps: 60

# 0.7：墙脚本（视觉运行时；docs/scripting.md）
scripts:
  # 单面墙可挂的脚本规则数上限（防玩家堆几百条规则拖慢服务器）。
  # /canvas reload 可热更，只影响后续创建，不裁剪已有规则。
  max-rules-per-wall: 16
  # 单面墙的元素总数上限（脚本"克隆元素"积木反复克隆是唯一能无限堆元素的入口；默认 200）。
  # 达到上限后克隆动作会被拒绝（不崩、不影响其他动作），只约束脚本克隆，不限制正常编辑。
  # /canvas reload 可热更，下一次克隆即生效。
  max-elements-per-wall: 200
  # "玩家靠近"触发器的采样间隔（游戏 tick，20 tick = 1 秒；默认 10 = 半秒扫一次）。
  # 数字越小反应越灵敏，但服务器主线程扫描越频繁（每轮 = 靠近规则数 × 在线玩家数次
  # 距离比较）；范围 1..200，/canvas reload 可热更。底层任务固定每 2 tick 跑一次，
  # 所以填 1 和 2 效果一样。
  player-near-sample-ticks: 10
  # 执行预算三闸（docs/scripting.md §2.4；/canvas reload 可热更）。
  budget:
    # 单次触发展开执行的动作总数（含嵌套 if 分支与 wait 续接累计）。
    max-actions-per-run: 50
    # 单条规则每秒最多触发次数（超出的触发直接丢弃 + 审计记录）。
    max-runs-per-second: 10
    # 链式熔断：脚本写变量又触发别的脚本，链深达到此值时掐断本次执行。
    # 只掐断不自动禁用脚本——日志和审计会告诉你是哪条规则在转圈。
    max-chain-depth: 8
  # 0.7.1：补间动画引擎参数。
  tween:
    # SES cadence 上限兼 per-wall fps 硬上限（发送地图包的最大速率）。
    # 这是管理员保护整台服务器的总阀门；插件不做成本估算、不自动降级。
    # per-wall 帧率由 canvas.tweenFps WS op 设置（默认 30fps）。
    max-fps: 60
    # 同时活跃的补间动画上限（超限新任务报错不执行，不裁剪已有任务）。
    max-concurrent: 16
  # 脚本"执行命令"积木的命令模板白名单（docs/scripting.md §5.2）。
  # 插件不内置任何模板——这里没写的模板，脚本里引用了也不会执行（安全设计）。
  # 规则：
  #   - command 是真正执行的命令全文，{参数名} 是占位符，由脚本作者填值
  #   - 每个占位符必须在 params 里声明；填进来的值会自动剥掉换行和 § 颜色码
  #   - 值里带 @（目标选择器）一律拒绝执行，除非该参数声明 type: online-player
  #     （此时值必须是某个在线玩家的名字，杜绝 @a / @e 选择器夺权）
  #   - max-length 是单个参数值的长度上限，默认 64
  #   - 参数值可以含空格，空格会成为命令的额外参数——设计模板时把自由文本参数
  #     放在命令末尾（比如 say 的消息），别放在 give 这类按空格切参的命令中间
  #   - 命令以服务器控制台身份执行（模板是你写的，等于你授权了这些命令）
  #   - 每次执行都会进审计日志（事件 SCRIPT_COMMAND_EXECUTED，含替换后的命令全文）
  # 示例（去掉注释即可用）：
  # command-templates:
  #   announce:
  #     command: "say [招牌] {msg}"
  #     params:
  #       msg: { max-length: 64 }
  #   give-reward:
  #     command: "give {player} diamond 1"
  #     params:
  #       player: { type: online-player }

# 国际化（i18n）：玩家在游戏内看到的文字
i18n:
  # 玩家客户端语言无对应 lang 文件、或某条文案缺译时的兜底语言。
  # 内置 en_us / zh_cn；可在 plugins/HikariCanvas/lang/ 自加语言文件后用其文件名（去 .yml）。
  default-locale: en_us
