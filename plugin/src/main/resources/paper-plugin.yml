name: HikariCanvas
version: '0.9.16-SNAPSHOT'
main: ac.haru.hikaricanvas.HikariCanvas
api-version: '1.21'
authors:
  - HyacinthHaru
description: Text signage plugin with TTF font rendering, template system, and a live web editor.
website: https://github.com/HyacinthHaru/HikariCanvas

# 硬依赖：PacketEvents 是 GPL-3.0，不打包进本 jar（避免污染本项目 MIT 授权）。
# 服主须单独安装 PacketEvents 插件（https://modrinth.com/plugin/packetevents 或 SpigotMC）。
# 用途：MapPacketSender 用 WrapperPlayServerMapData 把渲染像素推给玩家——核心投影通道，必装。
dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

# 权限节点（完整节点表见 docs/security.md §5）
# 默认权限策略：编辑 / 提交类权限给所有玩家，管理类保留 op
permissions:
  canvas.use:
    description: Use any HikariCanvas functionality
    default: true
  canvas.edit:
    description: Open an editing session
    default: true
  canvas.wand:
    description: Receive a Canvas Wand
    default: true
  canvas.commit:
    description: Commit (save) a sign
    default: true
  canvas.admin:
    description: Administrative commands (stats / cleanup / reload)
    default: op
  canvas.admin.force-break:
    description: Break HikariCanvas-managed item frames / supporting blocks
    default: op
  canvas.admin.bypass-limit:
    description: Bypass rate limits and canvas size caps
    default: op
  canvas.bench:
    description: Run the server-side render benchmark (/canvas bench list/run/report/clear)
    default: op
  canvas.upload:
    description: Upload images for use as ImageElement
    default: true
  canvas.upload.bypass-limit:
    description: Bypass per-player / per-wall / total-disk image quota
    default: op
  canvas.delete.own:
    description: Delete walls you own (used by /canvas delete)
    default: true
  canvas.delete.any:
    description: Delete any wall regardless of owner
    default: op
  canvas.alias.any:
    description: Set alias on any wall (moderation)
    default: op
  canvas.admin.bypass-lock:
    description: Open / edit locked walls created by others (动态展示插件 / admin)
    default: op
  canvas.template.save:
    description: Publish the current wall as a workshop template
    default: true
  canvas.template.delete.own:
    description: Delete templates you authored
    default: true
  canvas.template.delete.any:
    description: Delete any workshop template (moderation)
    default: op
  canvas.template.feature:
    description: Mark / unmark templates as featured on the marketplace
    default: op
  canvas.template.bypass-limit:
    description: Bypass per-player template publication count quota
    default: op
  canvas.template.use-others:
    description: Apply user-templates owned by other players (workshop cross-user)
    default: op
  canvas.var.read:
    description: 查看变量列表与值
    default: true
  canvas.var.write.own:
    description: 在自己的 wall 上创建 / 修改用户变量
    default: true
  canvas.var.write.any:
    description: 在任意 wall 上修改用户变量（管理员）
    default: op
  canvas.var.delete.own:
    description: 删除自己 wall 上的用户变量
    default: true
  canvas.var.delete.any:
    description: 删除任意 wall 上的用户变量（管理员）
    default: op
  canvas.var.bind:
    description: 把用户变量绑定到插件 namespace（敏感）
    default: op
  canvas.var.command:
    description: 使用 /canvas var 命令族
    default: op
  canvas.var.global.create:
    description: 创建全局用户变量（userglobal/*，跨 wall 共享）
    default: true
  canvas.var.global.write.own:
    description: 修改自己创建的全局用户变量值 / type / defaultValue
    default: true
  canvas.var.global.write.any:
    description: 修改任意全局用户变量（管理员 override）
    default: op
  canvas.var.global.delete.own:
    description: 删除自己创建的全局用户变量
    default: true
  canvas.var.global.delete.any:
    description: 删除任意全局用户变量（管理员 override）
    default: op
  canvas.schedule.own:
    description: 管理自己 wall 的列车 / 公交时刻表
    default: true
  canvas.schedule.any:
    description: 管理任意 wall 的时刻表（管理员）
    default: op
  canvas.rail.line.create:
    description: 创建铁路线路
    default: true
  canvas.rail.line.edit.own:
    description: 编辑自己创建的铁路线路 / 站点 / 车次 / 时刻表
    default: true
  canvas.rail.line.edit.any:
    description: 编辑任意铁路线路（管理员）
    default: op
  canvas.rail.line.delete.own:
    description: 删除自己创建的铁路线路
    default: true
  canvas.rail.line.delete.any:
    description: 删除任意铁路线路（管理员）
    default: op
  canvas.rail.wall.bind:
    description: 把 wall 绑定到铁路网络（wall owner 走 schedule.own）
    default: true
  canvas.script.edit:
    description: 给自己能打开的墙编排积木脚本
    default: true
  canvas.script.trigger.global:
    description: 使用全服事件触发器（玩家进服/被击杀）
    default: true
  canvas.script.sound:
    description: 在脚本里使用"播放声音"积木
    default: true
  canvas.script.command:
    description: 在脚本里使用"执行命令模板"积木（危险面）
    default: op
