name: HikariCanvas
version: '${version}'
main: ac.haru.hikaricanvas.HikariCanvas
api-version: '1.21'
authors:
  - HyacinthHaru
description: Custom map signage and dynamic displays with TTF fonts, templates, animations, and a live web editor.
website: https://github.com/HyacinthHaru/HikariCanvas

# 必装前置：PacketEvents 采用 GPL-3.0 协议，不打包进本插件 jar（避免传染本项目的 MIT 授权）。
# 服主需单独下载安装 PacketEvents 插件（https://modrinth.com/plugin/packetevents），用于向客户端推送地图画面数据包。
dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

# 默认权限策略：日常创建与编辑类权限默认对所有玩家开放，全服管理与跨玩家操作权限默认仅限管理员（op）。
permissions:
  canvas.use:
    description: Use HikariCanvas commands (/canvas)
    default: true
  canvas.edit:
    description: Create, open, list, and edit canvas walls
    default: true
  canvas.wand:
    description: Get a Canvas Wand directly via /canvas wand
    default: true
  canvas.admin:
    description: Run administrative commands (/canvas stats, diagnose, and reload)
    default: op
  canvas.admin.force-break:
    description: Break protected HikariCanvas item frames and supporting blocks
    default: op
  canvas.bench:
    description: Run server-side performance benchmarks (/canvas bench)
    default: op
  canvas.upload:
    description: Upload custom images in the web editor
    default: true
  canvas.upload.bypass-limit:
    description: Bypass daily upload count and server disk storage quotas for images
    default: op
  canvas.delete.own:
    description: Delete walls you own (/canvas delete)
    default: true
  canvas.delete.any:
    description: Delete any wall regardless of owner
    default: op
  canvas.alias.any:
    description: Set or change the alias of any wall
    default: op
  canvas.admin.bypass-lock:
    description: Open locked walls owned by other players
    default: op
  canvas.template.save:
    description: Publish a wall to the template gallery as a community template
    default: true
  canvas.template.delete.own:
    description: Delete community templates you published
    default: true
  canvas.template.delete.any:
    description: Delete any community template regardless of author
    default: op
  canvas.template.feature:
    description: Mark or unmark templates as featured in the template gallery
    default: op
  canvas.template.bypass-limit:
    description: Bypass the per-player community template publishing limit
    default: op
  canvas.template.use-others:
    description: Apply community templates published by other players
    default: op
  canvas.var.read:
    description: View variables and their current values
    default: true
  canvas.var.write.own:
    description: Create or modify user variables on walls you own
    default: true
  canvas.var.write.any:
    description: Create or modify user variables on any wall
    default: op
  canvas.var.delete.own:
    description: Delete user variables on walls you own
    default: true
  canvas.var.delete.any:
    description: Delete user variables on any wall
    default: op
  canvas.var.bind:
    description: Bind variables to external plugin data namespaces
    default: op
  canvas.var.command:
    description: Run variable management commands (/canvas var)
    default: op
  canvas.var.global.create:
    description: Create server-wide global user variables
    default: true
  canvas.var.global.write.own:
    description: Modify global user variables you created
    default: true
  canvas.var.global.write.any:
    description: Modify any global user variable regardless of owner
    default: op
  canvas.var.global.delete.own:
    description: Delete global user variables you created
    default: true
  canvas.var.global.delete.any:
    description: Delete any global user variable regardless of owner
    default: op
  canvas.schedule.own:
    description: Manage transit schedules on walls you own
    default: true
  canvas.schedule.any:
    description: Manage transit schedules on any wall
    default: op
  canvas.rail.line.create:
    description: Create railway lines
    default: true
  canvas.rail.line.edit.own:
    description: Edit railway lines, stations, runs, and timetables you created
    default: true
  canvas.rail.line.edit.any:
    description: Edit any railway line regardless of owner
    default: op
  canvas.rail.line.delete.own:
    description: Delete railway lines you created
    default: true
  canvas.rail.line.delete.any:
    description: Delete any railway line regardless of owner
    default: op
  canvas.rail.wall.bind:
    description: Bind walls to railway stations
    default: true
  canvas.script.edit:
    description: Create and edit block scripts on walls you can open
    default: true
  canvas.script.trigger.global:
    description: Use global or public script triggers (player join, quit, kill, or right-clicking a wall)
    default: true
  canvas.script.sound:
    description: Use sound and particle effect blocks in wall scripts
    default: true
  canvas.script.broadcast:
    description: Broadcast chat messages or screen titles to all online players from wall scripts
    default: true
  canvas.script.command:
    description: Execute whitelisted server command templates in wall scripts
    default: op
