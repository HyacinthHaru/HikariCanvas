name: HikariCanvas
version: '0.1.0-SNAPSHOT'
main: moe.hikari.canvas.HikariCanvas
api-version: '1.21'
authors:
  - HaruHyacinth
description: Text signage plugin with TTF font rendering, template system, and a live web editor.
website: https://github.com/HyacinthHaru/HikariCanvas

# 权限节点（完整节点表见 docs/security.md §5）
# M2 demo 阶段：编辑 / 提交类权限给所有玩家，管理类保留 op
permissions:
  canvas.use:
    description: Use any HikariCanvas functionality
    default: true
  canvas.edit:
    description: Open an editing session
    default: true
  canvas.wand:
    description: Receive a Canvas Wand
    default: true
  canvas.commit:
    description: Commit (save) a sign
    default: true
  canvas.admin:
    description: Administrative commands (stats / cleanup / reload)
    default: op
  canvas.admin.force-break:
    description: Break HikariCanvas-managed item frames / supporting blocks
    default: op
  canvas.admin.bypass-limit:
    description: Bypass rate limits and canvas size caps
    default: op
  canvas.upload:
    description: Upload images for use as ImageElement
    default: true
  canvas.upload.bypass-limit:
    description: Bypass per-player / per-wall / total-disk image quota
    default: op
  canvas.delete.own:
    description: Delete walls you own (used by /canvas delete)
    default: true
  canvas.delete.any:
    description: Delete any wall regardless of owner
    default: op
  canvas.alias.own:
    description: Set alias on walls you own
    default: true
  canvas.alias.any:
    description: Set alias on any wall (moderation)
    default: op
  canvas.admin.bypass-lock:
    description: Open / edit locked walls created by others (动态展示插件 / admin)
    default: op
  canvas.template.save:
    description: Publish the current wall as a workshop template
    default: true
  canvas.template.delete.own:
    description: Delete templates you authored
    default: true
  canvas.template.delete.any:
    description: Delete any workshop template (moderation)
    default: op
  canvas.template.feature:
    description: Mark / unmark templates as featured on the marketplace
    default: op
  canvas.template.bypass-limit:
    description: Bypass per-player template publication count quota
    default: op
  canvas.template.use-others:
    description: Apply user-templates owned by other players (workshop cross-user)
    default: op
