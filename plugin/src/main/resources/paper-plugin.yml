name: HikariCanvas
version: '${version}'
main: ac.haru.hikaricanvas.HikariCanvas
api-version: '1.21'
authors:
  - HyacinthHaru
description: Text signage plugin with TTF font rendering, template system, and a live web editor.
website: https://github.com/HyacinthHaru/HikariCanvas

# 硬依赖：PacketEvents 是 GPL-3.0，不打包进本 jar（避免污染本项目 MIT 授权）。
# 服主须单独安装 PacketEvents 插件（https://modrinth.com/plugin/packetevents 或 SpigotMC）。
# 用途：MapPacketSender 用 WrapperPlayServerMapData 把渲染像素推给玩家——核心投影通道，必装。
dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

# 权限节点（完整节点表见 docs/security.md §5）
# 默认权限策略：编辑 / 提交类权限给所有玩家，管理类保留 op
permissions:
  canvas.use:
    description: Use any HikariCanvas command (master switch on the /canvas root node)
    default: true
  canvas.edit:
    description: Open an editing session
    default: true
  canvas.wand:
    description: Receive a Canvas Wand
    default: true
  canvas.admin:
    description: Administrative commands (stats / diagnose / reload) and the server-wide wall list
    default: op
  canvas.admin.force-break:
    description: Break HikariCanvas-managed item frames / supporting blocks
    default: op
  canvas.bench:
    description: Run the server-side render benchmark (/canvas bench list/run/report/clear)
    default: op
  canvas.upload:
    description: Upload images for use as ImageElement
    default: true
  canvas.upload.bypass-limit:
    description: Bypass per-player / per-wall / total-disk image quota
    default: op
  canvas.delete.own:
    description: Delete walls you own (used by /canvas delete)
    default: true
  canvas.delete.any:
    description: Delete any wall regardless of owner
    default: op
  canvas.alias.any:
    description: Set alias on any wall (moderation)
    default: op
  canvas.admin.bypass-lock:
    description: Open locked walls created by other players
    default: op
  canvas.template.save:
    description: Publish the current wall as a workshop template
    default: true
  canvas.template.delete.own:
    description: Delete templates you authored
    default: true
  canvas.template.delete.any:
    description: Delete any workshop template (moderation)
    default: op
  canvas.template.feature:
    description: Mark / unmark templates as featured on the marketplace
    default: op
  canvas.template.bypass-limit:
    description: Bypass per-player template publication count quota
    default: op
  canvas.template.use-others:
    description: Apply user-templates owned by other players (workshop cross-user)
    default: op
  canvas.var.read:
    description: View variable list and values
    default: true
  canvas.var.write.own:
    description: Create or modify user variables on your own walls
    default: true
  canvas.var.write.any:
    description: Modify user variables on any wall (moderation)
    default: op
  canvas.var.delete.own:
    description: Delete user variables on your own walls
    default: true
  canvas.var.delete.any:
    description: Delete user variables on any wall (moderation)
    default: op
  canvas.var.bind:
    description: Bind user variables to external plugin namespaces
    default: op
  canvas.var.command:
    description: Use the /canvas var command family
    default: op
  canvas.var.global.create:
    description: Create global user variables (userglobal/*)
    default: true
  canvas.var.global.write.own:
    description: Modify global user variables you created
    default: true
  canvas.var.global.write.any:
    description: Modify any global user variable (moderation)
    default: op
  canvas.var.global.delete.own:
    description: Delete global user variables you created
    default: true
  canvas.var.global.delete.any:
    description: Delete any global user variable (moderation)
    default: op
  canvas.schedule.own:
    description: Manage transit schedules on your own walls
    default: true
  canvas.schedule.any:
    description: Manage transit schedules on any wall (moderation)
    default: op
  canvas.rail.line.create:
    description: Create railway lines
    default: true
  canvas.rail.line.edit.own:
    description: Edit railway lines, stations, runs, and timetables you created
    default: true
  canvas.rail.line.edit.any:
    description: Edit any railway line (moderation)
    default: op
  canvas.rail.line.delete.own:
    description: Delete railway lines you created
    default: true
  canvas.rail.line.delete.any:
    description: Delete any railway line (moderation)
    default: op
  canvas.rail.wall.bind:
    description: Bind walls to railway stations
    default: true
  canvas.script.edit:
    description: Author visual block scripts on walls you can open
    default: true
  canvas.script.trigger.global:
    description: Use server-wide script triggers (player join / kill)
    default: true
  canvas.script.sound:
    description: Use play-sound blocks in wall scripts
    default: true
  canvas.script.broadcast:
    description: Broadcast script messages or titles server-wide
    default: true
  canvas.script.command:
    description: Use whitelisted command-template blocks in wall scripts
    default: op
