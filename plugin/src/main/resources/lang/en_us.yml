      started: "<gray>Tween benchmark started (<measured> measured + <warmup> warmup)…</gray>"
      done: "<gold>Tween benchmark complete:</gold>"
      failed: "<red>Benchmark failed: <message></red>"
      subtitle: "<gray>Tween frame-rate benchmark (deepCopy + interpolation, <measured> measured, <warmup> warmup)</gray>"
      table-header: "<gray>walls     p50(ms)   p95(ms)   p99(ms)   mean(ms)  max(ms)</gray>"
      row: "<gray><n>  <p50>  <p95>  <p99>  <mean>  <max></gray>"
