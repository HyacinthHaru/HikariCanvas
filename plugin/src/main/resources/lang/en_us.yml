_meta:
  name: "English (US)"
common:
  prefix: "<gold>[HikariCanvas]</gold> "
command:
  no-session: "<gray>No active session.</gray>"
  no-wall-session: "<red>No active wall session.</red>"
  no-session-edit-first: "<red>No active session. Run /canvas edit first.</red>"
  confirm-failed: "<red>Failed to confirm session, server log for details.</red>"
  edit:
    guide-headline-new: "<gold>Selection mode on. Pick the wall corners:</gold>"
    guide-headline-reset: "<gold>Selection reset. Pick the wall corners again:</gold>"
    guide-step1: "<gray>  ① Left-click the first wall block (or item frame on it)</gray>"
    guide-step2: "<gray>  ② Right-click the opposite corner block</gray>"
    guide-step3: "<gray>  ③ Run /canvas confirm to open the editor</gray>"
    already-open: "<yellow>Editor is already open. Use /canvas cancel to close it, or open the URL from the previous /canvas confirm.</yellow>"
    session-closing: "<gray>Session is closing; try again in a moment.</gray>"
  wand:
    received: "<gold>Received Canvas Wand. Left-click / right-click blocks to select corners.</gold>"
  cancel:
    cancelled: "<yellow>Session cancelled (was <prev_state>). <wand_note>Wall data preserved — use /canvas open or right-click ItemFrame to resume.</yellow>"
    cancelled-wand-returned: "Wand returned. "
    cancelled-no-wand: ""
  open:
    not-found: "<red>No such wall: <id_or_alias></red>"
    already-has-session: "<red>You already have an active session (state=<state>). Use /canvas cancel first.</red>"
    wall-occupied: "<red>Wall is being edited by <other_player>.</red>"
    bind-failed: "<red>Cannot bind wall: <detail></red>"
    forbidden: "<red>Wall is locked: <message></red>"
    editor-url: "<gray>Open editor: </gray><aqua><underlined><url></underlined></aqua>"
    editor-url-hover: "Click to open in browser"
    summary: "<green>Opened wall <wall_id><alias_part> · <width>×<height></green>"
    alias-part: " (alias: <alias>)"
  list:
    empty: "<gray>You have no canvas walls yet. Use /canvas edit to create one.</gray>"
    header: "<gold>Your canvas walls: <total> total (<locked> locked, <drafts> editing)</gold>"
    line-hover: "Click to suggest /canvas open <wall_id>"
    line-locked: "<aqua>  [L] <wall_id><alias_part> · <width>x<height> · <world> (<x>,<y>,<z>) <facing></aqua>"
    line-draft: "<gray>  [D] <wall_id><alias_part> · <width>x<height> · <world> (<x>,<y>,<z>) <facing></gray>"
  alias:
    invalid-format: "<red>Alias must match [A-Za-z0-9_-]{2,32}.</red>"
    wall-not-found: "<red>Wall not found.</red>"
    not-owner: "<red>Only the wall owner can change alias.</red>"
    in-use: "<red>Alias '<alias>' is already in use.</red>"
    set-ok: "<green>Wall <wall_id> alias = <alias></green>"
  delete:
    not-found: "<red>No such wall: <wall_id></red>"
    not-owner: "<red>You can only delete your own walls (need canvas.delete.any otherwise).</red>"
    not-owner-confirm: "<red>You can only delete your own walls.</red>"
    already-pending: "<yellow>Already pending for wall <wall_id>. Type /canvas delete <wall_id> confirm to proceed.</yellow>"
    pending: "<yellow>About to delete wall <wall_id><alias_part>. Run /canvas delete <wall_id> confirm within 30s.</yellow>"
    pending-alias-part: " '<alias>'"
    expired: "<red>Confirm window expired or mismatched. Re-run /canvas delete <wall_id></red>"
    already-gone: "<gray>Wall already gone: <wall_id></gray>"
    deleted: "<green>Wall <wall_id> deleted. <frames> frames removed.</green>"
  confirm:
    not-ready: "<red>Not ready: <detail></red>"
    wall-invalid: "<red>Wall invalid: <reason> — <detail></red>"
    wall-occupied: "<red>This wall is already being edited (session <session_id>).</red>"
    pool-exhausted: "<red>Pool exhausted: <message>. Try smaller wall or wait.</red>"
    deploy-failed: "<red>Frame deployment failed: <message></red>"
    created: "<green>Wall created: <wall_id> · <width>×<height> (<frames> frames). Editor token valid 15 min.</green>"
    opened: "<green>Wall opened: <wall_id> · <width>×<height> (existing). Editor token valid 15 min.</green>"
    editor-url: "<gray>Open editor: </gray><aqua><underlined><url></underlined></aqua>"
    editor-url-hover: "Click to open in browser"
  stats:
    output: "<gold>MapPool: total=<pool_total>  free=<pool_free>  reserved=<pool_reserved>   |   Walls: <walls> (locked=<walls_locked>)   |   Sessions: <sessions>   |   Tokens: <tokens></gold>"
  cleanup:
    stubbed: "<yellow>cleanup is stubbed. Full fsck (orphan ItemFrame / pool-walls drift) implemented in M7.</yellow>"
  reload:
    config-type-mismatch: "<red>reload config: plugin type mismatch (internal bug)</red>"
    config-ok: "<gold>Config reloaded: <summary></gold>"
    config-restart-note: "<gray>Note: host/port changes require server restart to take effect.</gray>"
    templates-ok: "<gold>Templates reloaded: <builtin> builtin + <server> server (overrides=<overrides>, failed=<failed>) — total=<total></gold>"
    template-failure: "<red>  ✗ <file></red>"
  var:
    permission-denied: "<red>Permission denied: <node></red>"
    unknown-subcommand: "<red>Unknown subcommand: <sub></red>"
    not-found: "<red>Variable not found: <full_name></red>"
    failed: "<red>Failed: <code> — <message></red>"
    unexpected-error: "<red>Unexpected error: <message></red>"
    usage:
      header: "<gold>/canvas var</gold> <gray>subcommands:</gray>"
      list: "  <gray>/canvas var list [namespace]      </gray><dark_gray>— list namespaces / vars</dark_gray>"
      get: "  <gray>/canvas var get <fullName>        </gray><dark_gray>— variable metadata</dark_gray>"
      set: "  <gray>/canvas var set <fullName> <val>  </gray><dark_gray>— set current value</dark_gray>"
      delete: "  <gray>/canvas var delete <fullName>     </gray><dark_gray>— delete variable</dark_gray>"
      providers: "  <gray>/canvas var providers             </gray><dark_gray>— list registered providers</dark_gray>"
      reload: "  <gray>/canvas var reload                </gray><dark_gray>— reload config.yml rate limits</dark_gray>"
      inspect: "  <gray>/canvas var inspect <wallId>      </gray><dark_gray>— wall reverse index</dark_gray>"
    list:
      empty: "<gray>No variables in store.</gray>"
      header: "<gold>Variable namespaces (<ns_count> ns / <total> total):</gold>"
      ns-line: "  <gray><namespace></gray> <dark_gray>·</dark_gray> <green><count> var(s)</green>"
      ns-empty: "<gray>No variables in namespace: <namespace></gray>"
      ns-header: "<gold>Namespace '<namespace>' (<count> variable(s)):</gold>"
      var-line: "  <gray><full_name></gray> <dark_gray>[<yellow><type></yellow>]</dark_gray> <dark_gray>=</dark_gray> <white><value></white> <dark_gray>ttl=</dark_gray><gray><ttl></gray>"
    get:
      usage: "<gray>Usage: /canvas var get <fullName></gray>"
      header: "<gold>Variable</gold> <yellow><full_name></yellow>"
      namespace: "  <gray>namespace: </gray><white><value></white>"
      key: "  <gray>key:       </gray><white><value></white>"
      type: "  <gray>type:      </gray><white><value></white>"
      default: "  <gray>default:   </gray><white><value></white>"
      current: "  <gray>current:   </gray><white><value></white>"
      updated: "  <gray>updated:   </gray><white><value></white>"
      ttl: "  <gray>ttl:       </gray><white><value></white>"
      source: "  <gray>source:    </gray><white><value></white>"
      ref-by-walls: "  <gray>refByWalls:</gray><white><count></white>"
    set:
      usage: "<gray>Usage: /canvas var set <fullName> <value...></gray>"
      ok: "<green>✓ Set <full_name> = <value></green>"
    delete:
      usage: "<gray>Usage: /canvas var delete <fullName></gray>"
      ok: "<green>✓ Deleted <full_name></green>"
    providers:
      empty: "<gray>No providers registered.</gray>"
      header: "<gold>Registered providers (<count>):</gold>"
      line-dynamic: "  <gray><namespace></gray> <dark_gray>'</dark_gray><white><display_name></white><dark_gray>'</dark_gray> <aqua>[dynamic]</aqua> <dark_gray>keys=</dark_gray><gray><keys></gray> <dark_gray>interval=</dark_gray><gray><interval></gray>"
      line-static: "  <gray><namespace></gray> <dark_gray>'</dark_gray><white><display_name></white><dark_gray>'</dark_gray> <green>[static]</green> <dark_gray>keys=</dark_gray><gray><keys></gray> <dark_gray>interval=</dark_gray><gray><interval></gray>"
    reload:
      failed: "<red>Reload failed: <message></red>"
      ok: "<green>✓ Config reloaded. PushRateLimiter:</green>"
      per-plugin: "  <gray>per-plugin:           </gray><white><value>/s</white>"
      global: "  <gray>global:               </gray><white><value>/s</white>"
      circuit-break: "  <gray>circuit-break:        </gray><white><value>ms</white>"
    inspect:
      usage: "<gray>Usage: /canvas var inspect <wallId></gray>"
      wall-not-found: "<yellow>Wall not found: <wall_id></yellow> <gray>(inspecting referenced vars anyway)</gray>"
      no-refs: "<gray>No variables referenced by wall <wall_id> (may need a render pass to populate)</gray>"
      header: "<gold>Wall <wall_id> references <count> variable(s):</gold>"
      var-line: "  <gray><full_name></gray> <dark_gray>=</dark_gray> <white><value></white>"
      var-missing: "  <gray><full_name></gray> <dark_gray>=</dark_gray> <red>(missing from store!)</red>"
  bench:
    already-running: "<red>A benchmark is already running. Please wait.</red>"
    running: "<yellow>Benchmarking…</yellow>"
    list:
      no-scenes: "<gray>No benchmark scenes defined yet.</gray>"
      header: "<gold>Benchmark scenes (<count> total):</gold>"
      scene-line: "<gray>  <scene_id>  [<category>]  <tiles_wide>x<tiles_high> tiles  <element_type></gray>"
    run:
      started: "<gray>Benchmark started (scene='<selector>', <measured> measured + <warmup> warmup). Running in background…</gray>"
      failed: "<red>Benchmark failed: <message></red>"
      no-match: "<red>No scenes match '<selector>'. Use /canvas bench list to see available scenes.</red>"
      saved: "<gray>Saved to: <path></gray>"
    report:
      not-found: "<red>Report not found: <id></red>"
      empty: "<gray>No reports yet. Run /canvas bench run first.</gray>"
      missing-file: "<red>Report is missing <report_file>: <dir></red>"
      read-failed: "<red>Failed to read report: <message></red>"
      header: "<gold>Report <id>:</gold>"
    clear:
      nothing: "<gray>Nothing to clear (benchmarks directory does not exist).</gray>"
      failed: "<red>Clear failed: <message></red>"
      done: "<green>Cleared benchmarks directory (<count> items removed).</green>"
    summary:
      header: "<gold>Done — <scene_count> scene(s)  ·  blank baseline <blank_baseline_ms> ms</gold>"
      env: "<gray>Env: Java <java_version> · <processors> core(s) · max heap <max_heap_mb> · GC <gc_names></gray>"
      scene-line: "<gray>  <scene_id>  rasterize <p50>/<p95>/<p99> ms (p50/p95/p99)  palette <palette_p50> ms  alloc <alloc></gray>"
      per-element-header: "<gold>Marginal cost per element (ms/elem):</gold>"
      per-element-line: "<gray>  <element_type> <marginal_ms> ms/elem  (<element_count> total)</gray>"
      gc: "<gray>GC during test: <gc_count> collection(s), <gc_time_ms> ms total (incl. warmup)</gray>"
    run-tween:
      started: "<gray>Tween benchmark started (<measured> measured + <warmup> warmup)…</gray>"
      done: "<gold>Tween benchmark complete:</gold>"
      failed: "<red>Benchmark failed: <message></red>"
    run-script:
      started: "<gray>Script benchmark started (<measured> measured + <warmup> warmup)…</gray>"
      done: "<gold>Script benchmark complete:</gold>"
      failed: "<red>Benchmark failed: <message></red>"
    usage:
      header: "<gold>/canvas bench subcommands:</gold>"
      list: "<gray>  /canvas bench list                          — list benchmark scenes</gray>"
      run: "<gray>  /canvas bench run [scene] [iter] [warmup]   — run render benchmark</gray>"
      run-tween: "<gray>  /canvas bench run-tween [iter] [warmup]     — tween fps benchmark (0.7.x)</gray>"
      run-script: "<gray>  /canvas bench run-script [iter] [warmup]    — script action benchmark (0.7.x)</gray>"
      report: "<gray>  /canvas bench report [id]                   — show latest or given report</gray>"
      clear: "<gray>  /canvas bench clear                         — delete saved reports</gray>"
