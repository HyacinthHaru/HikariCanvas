    run-script:
      started: "<gray>Script benchmark started (<measured> measured + <warmup> warmup)…</gray>"
      done: "<gold>Script benchmark complete:</gold>"
      failed: "<red>Benchmark failed: <message></red>"
      subtitle: "<gray>Script action-chain benchmark (fake sink, incl. frame stack/trace, <measured> measured, <warmup> warmup)</gray>"
      table-header: "<gray>actions   p50(ms)   p95(ms)   p99(ms)   mean(ms)  max(ms)</gray>"
      row: "<gray><n>  <p50>  <p95>  <p99>  <mean>  <max></gray>"
      note: "<gray>Known limits: uses a fake ActionSink (O(1), no side effects); results reflect frame stack + SES dispatch + trace overhead, excluding real variable DB writes / element persistence / Bukkit main-thread hops.</gray>"
